workflows:
  android-release:
    name: BlendJam Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.3
    scripts:
      - name: Install Android SDK 36
        script: |
          # This is the Codemagic way to install SDKs
          flutter doctor --android-licenses
          flutter precache --android
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        script: |
          flutter pub get

      - name: Flutter clean
        script: |
          flutter clean
          flutter pub get

      - name: Generate app icons
        script: |
          dart run flutter_launcher_icons

      - name: Build APK
        script: |
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      email:
        recipients:
          - pmakpah@gmail.com
