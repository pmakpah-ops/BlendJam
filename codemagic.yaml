workflows:
  android-release:
    name: Android Release
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: 3.19.6  # <-- Lock Flutter version
      xcode: latest
      cocoapods: default
      vars:
        GRADLE_OPTS: "-Dorg.gradle.java.home=/Library/Java/JavaVirtualMachines/zulu-17.jdk/Contents/Home"
    scripts:
      - name: Set Gradle Version
        script: |
          cd android
          ./gradlew wrapper --gradle-version 7.6.3 --distribution-type all
      - name: Flutter build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
