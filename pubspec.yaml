name: blendjam
description: BlendJam DJ Mixer - Real Audio Blending
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17  # <-- Fixed: downgraded
  audio_waveforms: ^1.0.6
  file_picker: ^10.2.0
  ffmpeg_kit_flutter: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3  # <-- NEW: For app icon

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon.png  # <-- NEW: Your app icon

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
