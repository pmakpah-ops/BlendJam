name: blendjam_dj
description: 30 Song Auto DJ Mixer for Android
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.37
  audio_session: ^0.1.21
  file_picker: ^6.1.7
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  flutter_ffmpeg: ^0.4.2

flutter:
  uses-material-design: true
